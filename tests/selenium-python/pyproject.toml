[project]
name = "qa-ai-automation-selenium"
version = "0.1.0"
description = "Selenium Python tests for QA AI Automation Showcase"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0.0",
  "selenium>=4.20.0",
  "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "smoke: critical fast checks",
  "regression: broader behavior checks",
  "e2e: full end-to-end flows",
  "external: tests against public websites"
]
